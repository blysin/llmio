# =============================================================================
# 构建 llmio 镜像 → 推送到阿里云容器镜像服务 (ACR)
#
# 触发：push 到 cicd 分支（或手动 workflow_dispatch）
# 版本：读仓库根目录的 VERSION 文件，内容须形如 v0.8.17
# 产物：registry.cn-hangzhou.aliyuncs.com/blysin-base/llmio:vX.Y.Z
# 收尾：镜像推送成功后，自动创建并推送同名 git tag
#
# 发布流程：
#   1. 编辑 VERSION 文件，改成下一个版本号（例如 v0.8.18）
#   2. 提交并 push 到 cicd 分支
#   3. 本 workflow 自动：构建 → 推镜像 → 打 tag
#
# 需要你手动做的（一次性）：
#   - 不改动上游的 cicd.yml，它推 Docker Hub，fork 里没有 DOCKERHUB_TOKEN 必然失败
#   - 重建同一版本时用 workflow_dispatch 并勾选 force
#
# 说明：
#   - 只用 GITHUB_TOKEN 推 tag。GitHub 规定「由 GITHUB_TOKEN 触发的事件不会创建新的
#     workflow run」，所以这步不会连带触发 cicd.yml / releaser.yml。
#     反之，如果你从本地手动 push 同名 tag，那两个 workflow 会被触发（cicd.yml 会失败）。
#   - 只推版本号 tag，不推 latest。
# =============================================================================

name: Build and push image to Aliyun ACR

on:
  push:
    branches:
      - cicd
  workflow_dispatch:
    inputs:
      force:
        description: '重建模式：跳过 tag 冲突检查，且不创建 git tag（仅重新推送镜像）'
        type: boolean
        default: false

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: blysin-base
  IMAGE_NAME: llmio
  # ACR 用户名不是敏感信息（docker login 命令里本就是明文）。
  # 想改成仓库变量的话，建一个 ALIYUN_DOCKER_USERNAME 变量后换成 ${{ vars.ALIYUN_DOCKER_USERNAME }}
  REGISTRY_USER: blysin@163.com

# 自动创建并推送 git tag，需要写权限
permissions:
  contents: write

# 同一分支连续 push 时取消上一次运行，避免旧提交的镜像后发先至
concurrency:
  group: aliyun-acr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 必须声明 environment，否则读不到该 environment 下的 secret（见下面的 secrets.PASSWORD）
    environment: ALIYUN_DOCKER_USERNAME

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate VERSION
        id: ver
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then
            echo "::error::仓库根目录缺少 VERSION 文件，无法确定镜像版本号"
            exit 1
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION 内容为 '${VERSION}'，格式非法，必须形如 v0.8.17"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "版本号：${VERSION}"

      - name: Check tag availability
        if: ${{ github.event.inputs.force != 'true' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag ${VERSION} 在 origin 上已存在。"
            echo "::error::请把 VERSION 文件改成下一个版本号后重新 push；"
            echo "::error::若只是想重新推送同一版本的镜像，请用 workflow_dispatch 并勾选 force。"
            exit 1
          fi
          echo "tag ${VERSION} 可用，继续构建"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # 阿里云 ACR 对 OCI provenance 证明清单支持不佳，关掉以免拉取时出现 manifest 异常
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push git tag
        if: ${{ github.event.inputs.force != 'true' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "release ${VERSION}"
          git push origin "refs/tags/${VERSION}"
          echo "已创建并推送 tag ${VERSION}"

      - name: Summary
        run: |
          {
            echo "## 镜像已推送"
            echo ""
            echo "- 版本号：\`${{ steps.ver.outputs.version }}\`"
            echo "- 镜像地址：\`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}\`"
            echo "- Digest：\`${{ steps.build.outputs.digest }}\`"
            echo "- 构建来源：\`${{ github.ref_name }}\` @ \`${{ github.sha }}\`"
            echo "- Dockerfile 收到的 VERSION：\`${{ steps.ver.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
